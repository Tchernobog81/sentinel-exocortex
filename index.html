<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta name="loom-version" content="2.3.0" />
    <script>
    // anti-cache : si une version plus récente est déployée, recharger avec cache-buster
    (function(){ try {
      fetch('index.html?cb=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
        var m = t.match(/loom-version" content="([\d.]+)"/);
        var cur = (document.querySelector('meta[name=loom-version]') || {}).content || '0';
        if (m && parseFloat(m[1]) > parseFloat(cur)) location.href = '?v=' + m[1] + '&cb=' + Date.now();
      }).catch(function(){});
    } catch(e){} })();
    </script>
    <title>THE LOOM V2 — NELA</title>

    <link rel="stylesheet" crossorigin href="./assets/index-TShFfVwK.css">

</html>
