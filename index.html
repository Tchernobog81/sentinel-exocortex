<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>THE LOOM : EXOCORTEX v151</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #010102; 
            --sidebar-bg: #050508; 
            --border: rgba(255,255,255,0.08); 
            --accent: #fbbf24; 
            --bttf-grad: linear-gradient(180deg, #ff9d00 0%, #ffbd00 45%, #ffff00 100%); 
        }
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; 
            background-color: var(--bg); overflow: hidden; position: fixed; inset: 0; 
            font-family: 'JetBrains Mono', monospace; color: white; user-select: text;
        }

        #viewport { position: absolute; inset: 0; display: flex; }
        
        aside { 
            width: 200px; height: 100%; 
            background: var(--sidebar-bg); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 20;
        }
        
        .brand-header { 
            padding: 15px; border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 10px;
        }
        .brand-title { font-size: 11px; font-weight: 900; letter-spacing: 0.1em; color: #666; text-transform: uppercase; }
        .brand-version { color: var(--accent); }
        .timer-badge { font-size: 10px; color: #10b981; font-weight: bold; white-space: nowrap; }
        
        #flux-container { 
            flex: 0 0 35%; 
            border-bottom: 1px solid var(--border);
            padding: 15px; overflow: hidden; display: flex; flex-direction: column;
        }
        .section-title { 
            font-size: 10px; color: var(--accent); font-weight: 800; 
            text-transform: uppercase; margin-bottom: 8px; 
            display: flex; justify-content: space-between;
        }
        #activity-list { overflow-y: auto; list-style: none; padding: 0; margin: 0; flex: 1; }
        #activity-list li { 
            font-size: 10px; color: #bbb; margin-bottom: 6px; 
            padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.03); 
            line-height: 1.4; 
        }
        
        #legend-container { flex: 1; padding: 15px; overflow-y: auto; }
        .legend-item { 
            display: flex; align-items: center; justify-content: space-between; gap: 8px; 
            margin-bottom: 8px; cursor: pointer; transition: opacity 0.2s; user-select: none;
        }
        .legend-item:hover { opacity: 0.8; }
        .legend-item.hidden-line { opacity: 0.3; }
        .legend-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .legend-color { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
        .legend-text { 
            font-size: 9px; color: #888; font-weight: 700; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; 
        }
        
        main { flex: 1; position: relative; height: 100%; background: var(--bg); display: flex; flex-direction: column; }
        
        .top-bar { 
            height: 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: center; align-items: center; padding: 0 20px; position: relative;
        }
        .hud-btn { font-size: 10px; font-weight: 800; color: #666; text-transform: uppercase; cursor: pointer; transition: color 0.2s; }
        .hud-btn:hover { color: white; }
        
        .bttf-btn { 
            font-family: 'Inter', sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.5px;
            background: var(--bttf-grad); color: black;
            padding: 6px 16px; border-radius: 2px; border: none;
            box-shadow: 0 4px 15px rgba(255, 160, 0, 0.4); 
            transform: skewX(-10deg); font-size: 12px; text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .bttf-btn:hover { transform: skewX(-10deg) scale(1.05); box-shadow: 0 0 25px rgba(255, 160, 0, 0.8); color: black; }
        
        .canvas-wrapper { flex: 1; position: relative; width: 100%; overflow: hidden; }
        
        #loading-screen { 
            position: fixed; inset: 0; background: #020205; z-index: 9000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-family: 'JetBrains Mono'; transition: opacity 0.5s;
        }
        #debug-log { 
            width: 80%; max-width: 600px; height: 200px; 
            background: #000; border: 1px solid #333; 
            color: #00ff00; font-size: 10px; padding: 10px; 
            overflow-y: auto; margin-top: 20px; white-space: pre-wrap;
        }
        .log-err { color: #ef4444; font-weight: bold; }
        .log-warn { color: #f59e0b; }
        
        #detail-card { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 600px; background: rgba(5,5,8,0.98); 
            border: 1px solid #333; padding: 2rem; z-index: 5000; display: none;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        #label-float { 
            --label-bg: rgba(0,0,0,0.9); --label-border: var(--accent);
            position: fixed; pointer-events: none; background: var(--label-bg); 
            border: 1px solid var(--label-border); color: #fff; padding: 5px 10px; 
            z-index: 4000; display: none; align-items: center; gap: 8px; font-size: 10px; 
            border-radius: 2px; font-weight: bold;
        }
        #label-float::after { 
            content: ''; position: absolute; left: -1px; top: -1px; 
            width: 22px; height: 1px; background: var(--label-border);
            transform-origin: left center; transform: rotate(135deg);
        }
        .cyber-icon-frame { 
            width: 24px; height: 24px; border: 1px solid #333; 
            overflow: hidden; background: #000; display: flex; 
            align-items: center; justify-content: center; font-size: 14px; 
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="text-xl font-black text-white mb-2 tracking-widest">SYSTEM BOOT v151</div>
        <div class="text-xs text-zinc-500 mb-4">Connexion au cortex local v151...</div>
        <div id="debug-log">Init v151...</div>
    </div>

    <div id="viewport">
        <aside>
            <div class="brand-header">
                <div class="brand-title">The Loom <span class="brand-version text-emerald-400" onclick="forceReload()" style="cursor:pointer; text-decoration:underline;" title="Forcer la mise à jour (Cache Buster)">v151</span></div>
                <div id="timer-badge" class="timer-badge">Mise à jour...</div>
            </div>

            <div id="flux-container">
                <div class="section-title">
                    <span>Flux Entrant (12h)</span>
                    <span id="flux-count" class="text-zinc-500">0</span>
                </div>
                <ul id="activity-list" class="scrollbar-thin">
                    <li class="italic text-zinc-700">Chargement...</li>
                </ul>
            </div>

            <div id="legend-container"></div>
        </aside>

        <main>
            <div class="top-bar">
                <span id="sync-status" class="text-[9px] font-bold text-zinc-600 absolute left-4">OFFLINE</span>
                <button onclick="resetView()" class="hud-btn bttf-btn">RETOUR VERS LE FUTUR</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="loomChart"></canvas>
            </div>
        </main>
    </div>

    <div id="label-float"><div class="cyber-icon-frame"><span id="label-icon"></span></div><span id="label-text"></span></div>

    <div id="detail-card">
        <button onclick="closeDetail()" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-2xl">&times;</button>
        <h2 id="card-title" class="text-2xl font-black text-white mb-2 text-amber-500 uppercase"></h2>
        <div class="flex gap-4 text-[10px] text-zinc-500 uppercase mb-4 border-b border-zinc-800 pb-2">
            <span>Source: <b id="card-who" class="text-zinc-300"></b></span>
            <span>Date: <b id="card-date" class="text-zinc-300"></b></span>
        </div>
        <div id="card-nav" class="flex gap-2 mb-4"></div>
        <p id="card-desc" class="text-zinc-300 italic text-sm leading-relaxed mb-6"></p>

        <div id="card-analysis-section" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs border-t border-zinc-800 pt-4">
            <div>
                <h3 class="font-bold text-amber-500 uppercase text-[10px] mb-2">Analyse Pharmakon</h3>
                <div class="w-full flex rounded-full h-2.5 bg-zinc-800 overflow-hidden">
                    <div id="pharmakon-remedy-bar" class="bg-emerald-500 h-2.5" style="width: 50%"></div>
                    <div id="pharmakon-poison-bar" class="bg-red-500 h-2.5" style="width: 50%"></div>
                </div>
                <div class="flex justify-between text-[10px] mt-1">
                    <span class="text-emerald-400">Remède: <b id="pharmakon-remedy">50%</b></span>
                    <span class="text-red-400">Poison: <b id="pharmakon-poison">50%</b></span>
                </div>
            </div>
            <div>
                <h3 class="font-bold text-amber-500 uppercase text-[10px] mb-2">Position Courbe en S</h3>
                <div class="text-zinc-300"><b id="s-curve-phase" class="text-2xl font-mono mr-2">3</b> / 5</div>
                <p id="s-curve-desc" class="text-zinc-500 text-[10px]">Phase d'accélération</p>
            </div>
            <div class="md:col-span-2">
                <h3 class="font-bold text-amber-500 uppercase text-[10px] mb-1">Convergences & Grand Filtre</h3>
                <p id="convergences-text" class="text-zinc-400"></p>
            </div>
            <div class="md:col-span-2 border-t border-zinc-800 pt-3 mt-2">
                 <p id="final-note-text" class="text-zinc-500 italic"></p>
            </div>
        </div>

        <div class="mt-4 text-[9px] text-zinc-700 font-mono">ID: <span id="card-stamp"></span></div>
    </div>

    <script>
        // Configuration des URLs de fallback
        // Sources de données : ordre intelligent selon le contexte.
        // - Page servie en local (backend FastAPI, hostname localhost) : API d'abord.
        // - Page publique (GitHub Pages) : loom_data.json du dépôt d'abord (poussé par l'agent),
        //   puis GAS en fallback. Plus de tentative localhost qui échoue bruyamment.
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwg-ZzMeSRyoaTRV-u824eQvnd8tHYxTsk-xDSK4vhYy42OnMpFrpumj2NSEaA45gP-/exec';
        const isLocalHost = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
        const BACKEND_URLS = isLocalHost
            ? [
                'http://localhost:8000/api/data',  // Backend local FastAPI (dev Mac)
                'loom_data.json',                  // Fichier JSON local
                GAS_URL                            // Fallback legacy Google Apps Script
              ]
            : [
                'loom_data.json',                  // Fichier JSON du dépôt (GitHub Pages / push agent)
                GAS_URL,                           // Fallback legacy Google Apps Script
                'http://localhost:8000/api/data'   // Dernier recours (dev)
              ];
        
        // Couleurs des catégories
        const COLORS = { 
            "⚪ SINGULARITÉ": "#ffffff", 
            "✨ NOOSPHÈRE": "#0ea5e9",
            "🔮 IMAGINAIRE": "#f472b6", 
            "🟡 HARDWARE": "#fbbf24", 
            "🔵 COGNITION": "#3b82f6", 
            "🔴 RÉSEAU": "#ef4444", 
            "🟣 ESPACE": "#a855f7", 
            "🟢 BIOTECH": "#10b981", 
            "☢️ ENTROPIE": "#f97316", 
            "🏛️ POLITIQUE": "#d946ef",
            "DEFAUT": "#9ca3af" 
        };
        
        const ICONS = {
            "⚪ SINGULARITÉ": "🧠",
            "✨ NOOSPHÈRE": "🌍",
            "🔮 IMAGINAIRE": "📚",
            "🟡 HARDWARE": "💾",
            "🔵 COGNITION": "⚡",
            "🔴 RÉSEAU": "🌐",
            "🟣 ESPACE": "🚀",
            "🟢 BIOTECH": "🧬",
            "☢️ ENTROPIE": "☢️",
            "🏛️ POLITIQUE": "⚖️",
            "DEFAUT": "📂"
        };

        Chart.register(ChartDataLabels);
        let loomChart;
        let isHoveringLabel = false;
        let activeCategory = null;

        function log(msg, type="info") {
            const el = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            let color = "#00ff00";
            if(type==="error") color="#ef4444";
            if(type==="warn") color="#f59e0b";
            el.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        const decToDate = v => { 
            if(v < 0) return Math.floor(v); 
            const y=Math.floor(v); 
            return `T${Math.floor((v-y)*4)+1} ${y}`; 
        };
        const hexToRgba = (hex, a) => `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;

        // Fonction de chargement avec fallback chain
        async function loadDataFromSource(source, init = false) {
            try {
                if (source.url) {
                    log(`Tentative de chargement depuis ${source.label}...`);
                    const res = await fetch(source.url + '?t=' + new Date().getTime());
                    
                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }
                    
                    const text = await res.text();
                    
                    // Détection erreur HTML
                    if (text.trim().startsWith("<!DOCTYPE") || text.includes("<html")) {
                        throw new Error("Réponse HTML au lieu de JSON");
                    }
                    
                    const data = JSON.parse(text);
                    log(`✅ ${data.length} événements chargés depuis ${source.label}`);
                    return data;
                } else {
                    // Source est un tableau de données statiques
                    log(`✅ Chargement des données statiques (${source.data.length} événements)`);
                    return source.data;
                }
            } catch (e) {
                log(`❌ Échec ${source.label}: ${e.message}`, "error");
                return null;
            }
        }

        async function loadData(init = false) {
            // Essaye chaque source dans l'ordre
            for (const source of BACKEND_URLS.map(url => ({ url, label: url }))) {
                const data = await loadDataFromSource(source, init);
                if (data) {
                    try {
                        updateChart(data);
                        updateFlux(data);
                        updateLegend(data);
                        handleSmartFocus(data);
                    } catch (err) {
                        log(`❌ Erreur rendu: ${err.message}`, "error");
                    }

                    if (init) {
                        setTimeout(() => {
                            const ls = document.getElementById('loading-screen');
                            ls.style.opacity = 0;
                            setTimeout(() => ls.remove(), 500);
                        }, 500);
                    }
                    
                    const d = new Date();
                    const st = document.getElementById('sync-status');
                    st.innerText = `Source: ${source.label} | ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                    st.className = 'text-[9px] font-bold text-emerald-500 absolute left-4';
                    return;
                }
            }
            
            // Si tout échoue
            log("❌ Toutes les sources ont échoué", "error");
            const st = document.getElementById('sync-status');
            st.innerText = "OFFLINE (Tous les backends échoués)";
            st.className = 'text-[9px] font-bold text-red-500 absolute left-4';
        }

        function loadBackupData() {
            // Utilise le dernier élément de BACKEND_URLS (loom_data.json)
            loadData();
        }

        // --- Zoom intelligent ---
        let lastSeenIds = new Set();
        let isFirstLoad = true;

        function animateZoomTo(min, max) {
            // Zoom animé (Chart.js anime les bornes d'échelle via update())
            loomChart.options.scales.x.min = min;
            loomChart.options.scales.x.max = max;
            loomChart.update();
        }

        function adaptiveHalfWindow(targetYear, allData) {
            // Plus les événements s'accélèrent (denses autour de targetYear), plus on zoome serré
            const nearby = allData.filter(d => d.year >= targetYear - 15 && d.year <= targetYear + 1).length;
            if (nearby > 12) return 2;
            if (nearby > 6) return 5;
            return 10;
        }

        function handleSmartFocus(json) {
            const ids = new Set(json.map(d => d.id || d.label));
            if (isFirstLoad) {
                isFirstLoad = false;
                lastSeenIds = ids;
                // Vue initiale : timeline complète
                animateZoomTo(1940, 2050);
                log('Focus initial: 1940-2050 (vue complète)');
                return;
            }
            const newEvents = json.filter(d => !lastSeenIds.has(d.id || d.label));
            lastSeenIds = ids;
            if (newEvents.length > 0) {
                // Nouveaux événements détectés : zoom animé vers le cluster le plus récent,
                // avec une fenêtre adaptative (d'autant plus serrée que les événements s'accélèrent)
                const target = Math.max(...newEvents.map(d => d.year));
                const half = adaptiveHalfWindow(target, json);
                animateZoomTo(target - half, target + 0.5);
                log(`Zoom intelligent: ${newEvents.length} nouveaux événements → fenêtre ${target - half} … ${target + 0.5}`);
            }
        }

        function getStrandStyle(cat) {
            const baseColor = COLORS[cat] || COLORS["DEFAUT"];
            if (activeCategory && activeCategory !== cat) {
                return { color: hexToRgba(baseColor, 0.25), width: 1 };
            }
            return { color: baseColor, width: activeCategory ? 3 : 2 };
        }

        function updateChart(flatData) {
            const strands = {};
            if(!Array.isArray(flatData)) return;
            flatData.sort((a,b) => a.year - b.year);
            flatData.forEach(d => {
                let c = d.category || "DEFAUT";
                if(!COLORS[c]) c = Object.keys(COLORS).find(k => k.includes(c)) || "DEFAUT";
                
                const style = getStrandStyle(c);
                if(!strands[c]) strands[c] = { 
                    label: c, 
                    borderColor: style.color, 
                    backgroundColor: style.color, 
                    borderWidth: style.width, 
                    showLine: true,              // courbe reliant les événements de la catégorie
                    data: [], 
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    pointBorderColor: style.color,
                    pointBackgroundColor: '#010102',
                    pointBorderWidth: 2,
                    hitRadius: 30,
                    tension: 0.3 
                };
                strands[c].data.push({ x: d.year, y: d.value, ...d });
            });
            
            const sortedDatasets = Object.values(strands).sort((a, b) => {
                if (a.label.includes("SINGULARITÉ")) return 1;
                if (b.label.includes("SINGULARITÉ")) return -1;
                return a.label.localeCompare(b.label);
            });

            if (loomChart) {
                loomChart.data.datasets = sortedDatasets;
                // Transition animée (fluide) lors des rafraîchissements
                loomChart.update();
            } else {
                createChart(sortedDatasets);
            }
        }

        function createChart(datasets) {
            const ctx = document.getElementById('loomChart').getContext('2d');
            loomChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: false,
                            external: function(context) {
                                if (context.tooltip.opacity === 0) {
                                    if (detailCardTimeout) clearTimeout(detailCardTimeout);
                                    return;
                                }
                                const dataPoint = context.tooltip.dataPoints && context.tooltip.dataPoints[0];
                                if (!dataPoint || !dataPoint.raw) return;
                                showDetail(dataPoint.raw);
                            }
                        },
                        datalabels: {
                            display: function(context) {
                                const p = (context.dataset && context.dataset.data[context.dataIndex]) || (context.dataPoint && context.dataPoint.raw);
                                if (!p) return false;
                                const xRange = context.chart.scales.x.max - context.chart.scales.x.min;
                                // Zoomé dehors : seuls les points de bascule. Zoomé dedans : tous les labels.
                                return p.tipping || xRange < 8;
                            },
                            color: function(context) {
                                return COLORS[context.dataset.label] || '#fff';
                            },
                            formatter: function(value, context) {
                                const p = (context.dataset && context.dataset.data[context.dataIndex]) || value || {};
                                const icon = ICONS[p.category] || '•';
                                const xRange = context.chart.scales.x.max - context.chart.scales.x.min;
                                if (xRange < 8 && p.label) return `${icon} ${p.label.slice(0, 22)}`;
                                return icon;
                            },
                            font: { size: 14, weight: 'bold' },
                            offset: 8,
                            align: 'top'
                        },
                        zoom: {
                            zoom: {
                                wheel: { enabled: true, speed: 0.1 },
                                pinch: { enabled: true },
                                drag: { enabled: false },  // le clic sur un point ouvre sa fiche
                                mode: 'xy'
                            },
                            pan: { enabled: true, mode: 'xy' },
                            limits: { x: { minRange: 0.25 } }  // bloque le zoom à 1 trimestre min
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: 1940,
                            max: 2050,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: {
                            type: 'linear',
                            min: 0,
                            ticks: { color: '#666', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            display: false
                        }
                    },
                    onClick: (e) => {
                        const points = loomChart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, false);
                        if (points.length) {
                            const dataPoint = loomChart.data.datasets[points[0].datasetIndex].data[points[0].index];
                            showDetail(dataPoint);
                        }
                    },
                    onDoubleClick: () => { resetView(); log('Zoom reset (double-clic)'); },
                    animation: { duration: 700, easing: 'easeOutQuart' }
                },
                plugins: [{
                    id: 'connectorPlugin',
                    afterDatasetsDraw: (chart) => {
                        const ctx = chart.ctx;
                        const xRange = chart.scales.x.max - chart.scales.x.min;
                        const isZoomedIn = xRange < 8;

                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            if (meta.hidden) return;
                            meta.data.forEach((element, index) => {
                                const dataPoint = dataset.data[index];
                                if (!dataPoint.tipping && !isZoomedIn) return;
                                if (activeCategory && dataPoint.category !== activeCategory) return;

                                const model = element.tooltipPosition();
                                ctx.save();
                                ctx.beginPath();
                                ctx.lineWidth = 1;
                                ctx.strokeStyle = dataset.borderColor;
                                ctx.moveTo(model.x, model.y - 4);
                                ctx.lineTo(model.x, model.y - 12);
                                ctx.stroke();
                                ctx.restore();
                            });
                        });
                    }
                }]
            });
        }

        function updateFlux(data) {
            const now = new Date();
            const limit = new Date(now.getTime() - (12 * 60 * 60 * 1000));
            const recent = data.filter(d => d.timestamp && new Date(d.timestamp) > limit)
                               .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            document.getElementById('flux-count').innerText = recent.length;
            const list = document.getElementById('activity-list');
            list.innerHTML = '';
            
            if(recent.length === 0) list.innerHTML = '<li class="italic text-zinc-700">Aucun flux récent...</li>';
            else recent.forEach(item => {
                const li = document.createElement('li');
                const cat = item.category || "DEFAUT";
                const col = COLORS[cat] || '#fff';
                const mins = Math.floor((now - new Date(item.timestamp))/60000);
                const timeStr = mins < 60 ? `${mins}m` : `${Math.floor(mins/60)}h`;
                li.innerHTML = `<span style="color:${col}">${ICONS[cat] || '●'}</span> <span class="text-zinc-500 mr-1">[${timeStr}]</span> ${item.label}`;
                list.appendChild(li);
            });
        }

        function updateLegend(data) {
            const counts = {};
            data.forEach(d => {
                let c = d.category || "DEFAUT";
                if(!COLORS[c]) c = Object.keys(COLORS).find(k => k.includes(c)) || "DEFAUT";
                counts[c] = (counts[c] || 0) + 1;
            });
            const container = document.getElementById('legend-container');
            const totalEvents = Object.values(counts).reduce((a, b) => a + b, 0);
            container.innerHTML = `<div class="section-title"><span>Catégories</span><span class="text-zinc-500">${totalEvents}</span></div>`;
            
            const orderedKeys = Object.keys(COLORS).sort((a,b) => {
                if(a.includes("SINGULARITÉ")) return -1;
                if(b.includes("SINGULARITÉ")) return 1;
                return a.localeCompare(b);
            });

            orderedKeys.forEach(cat => {
                if(!counts[cat]) return;
                const div = document.createElement('div');
                div.className = 'legend-item';
                div.dataset.category = cat;
                div.innerHTML = `
                    <div class="legend-left">
                        <div class="legend-color" style="background:${COLORS[cat]}"></div>
                        <span class="legend-text">${cat}</span>
                    </div>
                    <span class="text-zinc-600">${counts[cat]}</span>
                `;
                div.onclick = () => toggleCategory(cat);
                container.appendChild(div);
            });
        }

        function toggleCategory(cat) {
            if (activeCategory === cat) {
                activeCategory = null;
            } else {
                activeCategory = cat;
            }
            
            // Mise à jour des styles
            document.querySelectorAll('.legend-item').forEach(el => {
                if (el.dataset.category === activeCategory) {
                    el.classList.remove('hidden-line');
                } else {
                    el.classList.add('hidden-line');
                }
            });
            
            updateChart(loomChart.data.datasets.flatMap(d => d.data));
            
            // Zoom intelligent sur la catégorie : fenêtre animée sur ses événements les plus récents
            if (activeCategory) {
                const catData = loomChart.data.datasets.flatMap(d => d.data)
                    .filter(d => (d.category || "DEFAUT") === activeCategory);
                if (catData.length) {
                    const maxY = Math.max(...catData.map(d => d.year));
                    const minY = Math.min(...catData.filter(d => d.year >= maxY - 20).map(d => d.year));
                    animateZoomTo(minY - 1, maxY + 0.5);
                    log(`Zoom catégorie ${activeCategory}: ${minY.toFixed(1)} … ${maxY.toFixed(1)}`);
                }
            } else {
                resetView();
            }
        }

        let detailCardTimeout;
        function showDetail(data) {
            if (detailCardTimeout) clearTimeout(detailCardTimeout);
            
            const card = document.getElementById('detail-card');
            document.getElementById('card-title').innerText = data.label;
            document.getElementById('card-who').innerText = data.whoWhat || 'N/A';
            document.getElementById('card-date').innerText = data.year ? Math.floor(data.year) : 'N/A';
            document.getElementById('card-desc').innerText = data.description || 'Pas de description.';
            
            // Analyse Pharmakon
            const remedy = data.pharmakon_remedy_percent || data.remedy_percent || 50;
            const poison = data.pharmakon_poison_percent || data.poison_percent || 50;
            document.getElementById('pharmakon-remedy').innerText = `${remedy}%`;
            document.getElementById('pharmakon-poison').innerText = `${poison}%`;
            document.getElementById('pharmakon-remedy-bar').style.width = `${remedy}%`;
            document.getElementById('pharmakon-poison-bar').style.width = `${poison}%`;
            
            // Courbe en S
            const phase = data.s_curve_phase || 3;
            document.getElementById('s-curve-phase').innerText = phase;
            const phases = ["Début", "Croissance", "Accélération", "Maturité", "Plateau"];
            document.getElementById('s-curve-desc').innerText = phases[phase - 1] || "Phase inconnue";
            
            // Convergences
            document.getElementById('convergences-text').innerText = data.convergences || 'N/A';
            document.getElementById('final-note-text').innerText = data.final_note || 'N/A';
            
            document.getElementById('card-stamp').innerText = `${data.category} | ${data.year}`;
            card.style.display = 'block';
        }

        function closeDetail() {
            document.getElementById('detail-card').style.display = 'none';
        }

        function resetView() {
            loomChart.options.scales.x.min = 1940;
            loomChart.options.scales.x.max = 2050;
            loomChart.update();
            closeDetail();
        }

        function forceReload() {
            location.href = location.href.split('?')[0] + '?t=' + new Date().getTime();
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            loadData(true);
            
            // Rafraîchissement automatique toutes les 5 minutes
            setInterval(() => {
                loadData();
            }, 5 * 60 * 1000);
        });

        // Fermer la detail card en cliquant à l'extérieur
        document.addEventListener('click', (e) => {
            const card = document.getElementById('detail-card');
            if (e.target === card) closeDetail();
        });

        // Gestion du clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDetail();
        });
    </script>
</body>
</html>
