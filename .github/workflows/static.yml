name: Deploy to GitHub Pages
run-name: The Loom v179 🚀

# V2.9.3 — Correctif "tâche qui plante systématiquement" :
# la boucle locale pousse toutes les ~10 min (24/7, ~144 déploiements/jour) et
# chaque push déclenche ici un déploiement GitHub Pages complet. À cette cadence,
# le service de promotion Pages échoue régulièrement côté serveur
# (statut "deployment_failed" -> "Deployment failed, try again later."),
# ce qui faisait échouer le run ~1 fois sur 2 (101 failures / 810 runs).
# Correctifs :
#   1. cancel-in-progress: false — annuler un run en cours laissait un déploiement
#      Pages encore actif côté serveur ; le run suivant échouait alors à coup sûr.
#      On laisse les déploiements se sérialiser (l'ancien passe "inactive").
#   2. retry du déploiement jusqu'à 5 tentatives avec backoff (30s/60s/120s/180s)
#      entre les tentatives : un retry immédiat en rafale se fait refuser par le
#      rate-limiting de Pages (échec en ~1s), il faut laisser le service respirer.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url || steps.d4.outputs.page_url || steps.d5.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages (tentative 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 2
        if: steps.d1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (tentative 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 3
        if: steps.d2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (tentative 3)
        id: d3
        if: steps.d2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 4
        if: steps.d3.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (tentative 4)
        id: d4
        if: steps.d3.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 5
        if: steps.d4.outcome == 'failure'
        run: sleep 180
      - name: Deploy to GitHub Pages (tentative 5)
        id: d5
        if: steps.d4.outcome == 'failure'
        uses: actions/deploy-pages@v4
