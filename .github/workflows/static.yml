name: Deploy to GitHub Pages
run-name: The Loom v179 🚀

# V2.9.4 — Le déploiement Pages ne se déclenche QUE sur les mises à jour du code
# de la page (paths-ignore sur les fichiers de données poussés par la boucle
# sentinel toutes les ~10 min). Auparavant, chaque push de données lançait un
# déploiement complet (~144/jour) et le service de promotion Pages échouait
# par intermittence à cette cadence ("deployment_failed" -> run en failure).
# Les données fraîches (loom_data.json / telemetry.json / rag.json) sont lues par
# le front via raw.githubusercontent.com (CDN, à jour à chaque push, zéro déploiement).
#
# Robustesse conservée :
#   1. cancel-in-progress: false — on laisse les déploiements se sérialiser.
#   2. retry du déploiement jusqu'à 5 tentatives avec backoff (30/60/120/180s).

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      # données poussées par la boucle sentinel (push d'événements toujours actif,
      # mais sans déclencher de déploiement Pages)
      - 'loom_data.json'
      - 'telemetry.json'
      - 'scan_heartbeat.json'
      - 'rag.json'
      - 'input.json'
      - 'loom_consolidated_v102.json'
      - 'loom_data_Gork.json'
      - 'loom_master_2026-01-22.json'
      - 'v2/web/public/loom_data.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url || steps.d4.outputs.page_url || steps.d5.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages (tentative 1)
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 2
        if: steps.d1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (tentative 2)
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 3
        if: steps.d2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (tentative 3)
        id: d3
        if: steps.d2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 4
        if: steps.d3.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (tentative 4)
        id: d4
        if: steps.d3.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant tentative 5
        if: steps.d4.outcome == 'failure'
        run: sleep 180
      - name: Deploy to GitHub Pages (tentative 5)
        id: d5
        if: steps.d4.outcome == 'failure'
        uses: actions/deploy-pages@v4
